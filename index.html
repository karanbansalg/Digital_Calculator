<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Calculator</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
  
  <div class="container">
    <div class="main">
      <div class="header">
        <input class="border" type="text" id="display" disabled />
      </div>
      <div class="section">
        <div class="buttons">
          <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>del</button>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>AC</button>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>/</button>
        <button>.</button>
        <button>0</button>
        <button>+</button>
        <button>-</button>
        <button>*</button>
        <button>=</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>

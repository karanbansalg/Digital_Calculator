<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Calculator</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
  
  <div class="container">
    <div class="main">
      <div class="header">
        <input class="screen border" id="display" type="text" disabled/>
      </div>
      <div class="section">
        <div class="buttons">
        <button class="number">7</button>
        <button class="number">8</button>
        <button class="number">9</button>
        <button class="del">del</button>
        <button class="number">4</button>
        <button class="number">5</button>
        <button class="number">6</button>
        <button class="ac">AC</button>
        <button class="number">1</button>
        <button class="number">2</button>
        <button class="number">3</button>
        <button class="operator" id="divide">/</button>
        <button class="float">.</button>
        <button class="number">0</button>
        <button class="operator" id="sum">+</button>
        <button class="operator" id="difference">-</button>
        <button class="number">00</button>
        <button class="ans">=</button>
        <button class="operator" id="mul">*</button>     
        <button class="operator" id="percentage">%</button>
        
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
